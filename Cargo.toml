# harmonia/Cargo.toml — virtual manifest
[workspace]
resolver = "3"
members = [
    "crates/aggelmata",
    "crates/horismos",
    "crates/apotheke",
    "crates/exousia",
    "crates/paroche",
    "crates/kathodos",
    "crates/epignosis",
    "crates/kritike",
    "crates/komide",
    "crates/eksetasis",
    "crates/ergasia",
    "crates/syndesmos",
    "crates/syndesis",
    "crates/aitesis",
    "crates/syntaxis",
    "crates/archon",
    "crates/prostheke",
    "crates/theatron/core",
    "crates/akouo-core",
    "crates/akouo-android",
    "crates/harmonia-convert",
]
exclude = [
    "crates/theatron/desktop",
]

[workspace.package]
version = "0.4.5"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

# WHY: declarative mirror of CI's `cargo clippy -- -D warnings` floor; member
# crates opt in via `[lints] workspace = true`. Stricter per-lint denies
# (unwrap_used, expect_used, ...) are enforced by `kanon lint`, not here.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
# ── Internal crates ────────────────────────────────────────────────────────────
aggelmata     = { path = "crates/aggelmata" }
horismos      = { path = "crates/horismos" }
apotheke      = { path = "crates/apotheke" }
exousia       = { path = "crates/exousia" }
paroche       = { path = "crates/paroche" }
kathodos      = { path = "crates/kathodos" }
epignosis     = { path = "crates/epignosis" }
kritike       = { path = "crates/kritike" }
komide        = { path = "crates/komide" }
eksetasis     = { path = "crates/eksetasis" }
ergasia       = { path = "crates/ergasia" }
syndesmos     = { path = "crates/syndesmos" }
syndesis      = { path = "crates/syndesis" }
aitesis       = { path = "crates/aitesis" }
syntaxis      = { path = "crates/syntaxis" }
archon        = { path = "crates/archon" }
prostheke     = { path = "crates/prostheke" }
skene            = { path = "crates/theatron/core" }
akouo-core       = { path = "crates/akouo-core" }
akouo-android    = { path = "crates/akouo-android" }
metousia         = { path = "crates/harmonia-convert" }

# ── Async runtime ──────────────────────────────────────────────────────────────
tokio           = { version = "1", features = ["full"] }

# ── HTTP server ────────────────────────────────────────────────────────────────
axum            = { version = "0.8", features = ["ws"] }
axum-extra      = { version = "0.12", features = ["query"] }
tower           = "0.5"
tower-http = { version = "0.6", features = [
  "trace",
  "cors",
  "compression-full",
] }

# ── HTTP client ────────────────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "query",
  "rustls-no-provider",
  "stream",
] }

# ── Serialization ──────────────────────────────────────────────────────────────
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
schemars        = "1"

# ── MCP server framework ──────────────────────────────────────────────────────
# WHY 1.7: the cancellation wiring (#652 PR 3) needs FromContextPart for
# CancellationToken, added in rmcp 1.3; we declare the resolved, CI-verified
# 1.7 line rather than float an untested floor. The lockfile pins the exact
# version and cargo-deny/lock review owns upgrades. Feature flags live in
# archon's manifest (the only consumer).
rmcp            = "3.1"

# ── Error handling ─────────────────────────────────────────────────────────────
snafu           = "0.9"

# ── Configuration ──────────────────────────────────────────────────────────────
figment         = { version = "0.10", features = ["toml", "env"] }

# ── Tracing ───────────────────────────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }

# ── Database ───────────────────────────────────────────────────────────────────
sqlx = { version = "0.8.6", features = [
  "sqlite",
  "runtime-tokio",
  "macros",
  "migrate",
] }

# ── Auth ───────────────────────────────────────────────────────────────────────
jsonwebtoken    = { version = "11", features = ["rust_crypto"] }
argon2          = "0.5"
rand            = "0.10"
subtle          = "2.6.1"

# ── IDs & strings ─────────────────────────────────────────────────────────────
ulid                    = { version = "3.0", features = ["serde"] }
uuid                    = { version = "1", features = ["v7", "serde"] }
compact_str             = { version = "0.10", features = ["serde"] }
unicode-normalization   = "0.1"

# ── Time ───────────────────────────────────────────────────────────────────────
jiff            = { version = "0.2", features = ["serde"] }

# ── File system ────────────────────────────────────────────────────────────────
walkdir         = "2.5"
notify          = "8.2"

# ── Audio metadata / tagging ──────────────────────────────────────────────────
lofty           = "=0.24.0"

# ── Audio decoding ─────────────────────────────────────────────────────────────
symphonia       = { version = "0.6", features = ["all"] }
opusic-c        = "1.6"
rubato          = "5.0"
ebur128         = "0.1"

# ── Audio output ───────────────────────────────────────────────────────────────
cpal            = "0.18"

# ── Image processing ──────────────────────────────────────────────────────────
image               = "0.25"
fast_image_resize   = "6.0"

# ── QUIC transport ─────────────────────────────────────────────────────────────
quinn           = "0.11"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }
rcgen           = { version = "0.14", features = ["pem"] }

# ── mDNS discovery ────────────────────────────────────────────────────────────
mdns-sd         = "0.21"

# ── Crypto utilities ──────────────────────────────────────────────────────────
# NOTE: md5 is mandated by the Last.fm API signature protocol, not a security choice.
md5             = "0.8"
sha1            = "0.11"
sha2            = "0.11"
base64          = "0.23"
rand_core       = { version = "0.6", features = ["getrandom"] }

# ── TOML (credential files) ───────────────────────────────────────────────────
toml            = "1.1"

# ── Scheduling ────────────────────────────────────────────────────────────────
tokio-cron-scheduler = "0.15"

# ── Acquisition ───────────────────────────────────────────────────────────────
librqbit        = "=9.0.1"
zip             = { version = "=8.6.0", default-features = false, features = [
  "deflate",
] }
unrar           = "0.5"
sevenz-rust2    = "=0.20.2"
nzb-rs          = "0.6"

# ── Feeds ──────────────────────────────────────────────────────────────────────
feed-rs         = "2.3"

# ── URL parsing ───────────────────────────────────────────────────────────────
url             = "2.5"

# ── CLI ───────────────────────────────────────────────────────────────────────
clap            = { version = "4", features = ["derive"] }


# ── XML ───────────────────────────────────────────────────────────────────────
quick-xml       = { version = "0.41", features = ["serialize"] }

# ── YAML (Cardigann indexer definitions) ─────────────────────────────────────
# NOTE: serde_norway is the maintained serde_yaml fork (serde_yaml and
# serde_yml are both unmaintained per RUSTSEC).
serde_norway    = "0.9"

# ── HTML scraping (Cardigann row/field selectors) ────────────────────────────
# NOTE: ego-tree is scraper's node-tree crate, needed by name to walk nodes;
# scraper's API exposes its types without re-exporting them.
scraper         = "0.27"
ego-tree        = "0.11"

# ── Concurrency ──────────────────────────────────────────────────────────────
dashmap         = "6"
tokio-util      = { version = "0.7", features = ["rt"] }
futures         = "0.3"

# ── Mobile FFI ────────────────────────────────────────────────────────────────
uniffi          = { version = "0.32", features = ["tokio"] }

# ── Bytes ────────────────────────────────────────────────────────────────────
bytes           = "1"

# ── Regex ────────────────────────────────────────────────────────────────────
regex           = "1"

# ── Test ───────────────────────────────────────────────────────────────────────
rstest          = "0.26"
tempfile        = "3"
ctor            = "1.0"

[profile.dev.package."*"]
opt-level = 2    # WHY: optimize deps for faster runtime during development

[profile.release]
lto = "thin"         # WHY: link-time optimization for binary size + speed
codegen-units = 1    # WHY: single codegen unit for maximum optimization
strip = true         # WHY: strip debug symbols from release binary
