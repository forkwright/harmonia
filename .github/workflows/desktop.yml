# WHY: periskopio is workspace-excluded, so workspace CI does not compile it.
name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/theatron/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "crates/theatron/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: periskopio-${{ hashFiles('crates/theatron/desktop/Cargo.toml') }}
          workspaces: "crates/theatron/desktop"
      - name: Check desktop
        run: cargo check --manifest-path crates/theatron/desktop/Cargo.toml
