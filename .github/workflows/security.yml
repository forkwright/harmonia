# WHY: Block merges on known vulnerabilities, license/source/ban violations,
# and leaked secrets. Runs `cargo audit` (RustSec DB), `cargo deny check`
# (licenses, sources, bans, advisories), OSV-Scanner, and gitleaks on every PR
# and daily against main so newly-published CVEs against existing deps are
# caught even when no PR is open. See standards/CI.md § Vulnerability scanning.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules. Non-overlapping with
    # stale (Sun 06:00 CST).
    - cron: "23 11 * * *"
  workflow_dispatch:

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    # WHY: checks licenses, banned crates (openssl-sys), source registries,
    # and the RustSec advisory DB using deny.toml's ignore list. Any
    # finding fails the job — suppressions require a deny.toml entry with
    # a WHY comment, not silent --ignore flags.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # PROJECT: security hardening — never expose token to steps
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # WHY: run every check explicitly so a schema regression in one
          # section can't silently disable the others. cargo-deny expects
          # the check subcommand followed by space-separated check names;
          # `arguments:` passes post-subcommand flags only.
          command: check advisories licenses bans sources
          arguments: --all-features

  cargo-audit:
    # WHY: cargo-deny's advisories check overlaps but uses a different code
    # path; running cargo-audit independently protects against bugs or
    # config drift disabling one of the two. See standards/CI.md.
    name: cargo audit
    runs-on: ubuntu-latest
    # WHY: bumped from kanon's 15m default because harmonia's 23-crate
    # workspace + cold-cache `cargo install cargo-audit --locked` exceeded
    # 15m on the first run (id 26389594858 cancelled at 20m). 30m gives
    # headroom; subsequent runs hit Swatinem/rust-cache and finish fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: cargo audit
        # WHY: -D unmaintained,unsound,yanked escalates those categories
        # to errors (default is warning only). Suppressions go through
        # .cargo/audit.toml, which mirrors deny.toml's [[advisories.ignore]]
        # entries — no silent --ignore flags here.
        run: cargo audit --deny unmaintained --deny unsound --deny yanked

  osv-scanner:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |
        --config=osv-scanner.toml
        --lockfile=Cargo.lock

  gitleaks:
    # WHY: .gitleaks.toml is tuned for this repo but previously had no
    # consuming CI job, so the no-secrets policy was local-only and bypassable
    # by a GitHub-side merge. Scans the working tree, not git history: history
    # is not rewritable and predates the allowlist; new leaks land in the tree.
    # WHY binary download, not gitleaks/gitleaks-action: the action requires a
    # GITLEAKS_LICENSE key for organization repos; the CLI itself is MIT.
    # Checksum-pinned so a compromised release asset cannot pass silently.
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version | grep -qx '8.30.1'
      - name: gitleaks scan
        run: /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
