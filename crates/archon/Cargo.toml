[package]
name = "archon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Binary entry point — assembles all subsystems"

[lib]
# WHY: a minimal lib surface so `tests/` integration crates can reach
# internals (e.g. `import::ImportAdapter`) that a bin-only crate cannot
# expose. `main.rs` depends on this lib crate exactly like an external
# consumer would (auto-linked by matching package/lib name).
name = "archon"
path = "src/lib.rs"

[[bin]]
name = "harmonia"
path = "src/main.rs"

[features]
# WHY: systemd watchdog/notify is Linux-only; keep disabled in CI and on macOS dev machines.
systemd = ["dep:sd-notify"]

[dependencies]
themelion.workspace = true
horismos.workspace = true
apotheke.workspace = true
exousia.workspace = true
paroche.workspace = true
kathodos.workspace = true
epignosis.workspace = true
kritike.workspace = true
komide.workspace = true
eksetasis.workspace = true
ergasia.workspace = true
syntaxis.workspace = true
aitesis.workspace = true
syndesmos.workspace = true
syndesis.workspace = true
prostheke.workspace = true
akouo-core = { workspace = true, features = ["native-output"] }
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
figment.workspace = true
serde.workspace = true
axum.workspace = true
reqwest.workspace = true
sqlx.workspace = true
serde_json.workspace = true
snafu.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
mdns-sd.workspace = true
toml.workspace = true
jiff.workspace = true
walkdir.workspace = true
uuid.workspace = true
# WHY: sd-notify cannot be a workspace dep — workspace deps cannot be optional.
sd-notify = { version = "0.5", optional = true }

[dev-dependencies]
rstest.workspace = true
tower.workspace = true
tempfile = "3"
# WHY: the #602 done-when test builds a real torrent fixture
# (librqbit::create_torrent) to drive the real SessionEngine end-to-end.
librqbit.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "test-util",
] }

[lints]
workspace = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-26"
exit-criteria = "issue:forkwright/harmonia#295"
