tower-http = { version = "0.7", features = [
  "trace",
  "cors",
  "compression-full",
  "fs",
  "timeout",
] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tracing.workspace = true
uuid.workspace = true
rand.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
