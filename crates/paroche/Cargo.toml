md5 = "0.8"
sqlx.workspace = true
mdns-sd.workspace = true
jiff.workspace = true
ulid.workspace = true
sha1.workspace = true
subtle.workspace = true
url.workspace = true
zip.workspace = true
quick-xml.workspace = true

[dev-dependencies]
sqlx.workspace = true
apotheke.workspace = true
base64.workspace = true
http-body-util = "0.1"
