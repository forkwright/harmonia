[package]
name = "periskopio"
version = "0.1.14"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
description = "Dioxus desktop UI for the Harmonia media platform"
publish = false

[dependencies]
skene = { path = "../core" }

# UI framework
dioxus = { version = "0.7", features = ["desktop", "router"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
# WHY declared rather than inherited: this crate is in the ROOT manifest's
# `exclude` list, not `members`, so it has no workspace to inherit from --
# `foo.workspace = true` fails the manifest parse outright with "failed to find
# a workspace root". CI checks it standalone via its own --manifest-path.
# Keep these in step with the root workspace declarations by hand.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Error handling
snafu = "0.9"

# Config persistence
dirs = "6"
toml = "1.0"

# periskopio uses inline lints because Cargo does not allow combining
# workspace lint inheritance with package-level overrides.
[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
await_holding_lock = "deny"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
map_err_ignore = "warn"
match_wildcard_for_single_variants = "warn"
needless_for_each = "warn"
rc_mutex = "warn"
string_add = "warn"
trait_duplication_in_bounds = "warn"
unused_self = "warn"
disallowed_methods = "deny"
disallowed_types = "deny"

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-26"
exit-criteria = "issue:forkwright/harmonia#295"
